<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>#dotlaboratory</title>
	<!-- <link rel="icon" href="favicon.ico"> -->
	<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/carousel/carousel.umd.js"></script>
	<script src="script.js"></script>
	<link rel="stylesheet" type="text/css" href="style.css" />
	<link rel="stylesheet" href="profile.css">

<body onload="init()" oncontextmenu="return false;">

			<div id="nav-team1" class="nav f-carousel">

				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">⚡</p></div>

				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🎵</p></div>

				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🫧</p></div>

				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🎵</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">☄️</p></div>
			</div>
		</div>
	</div>
	<div id="loading">
		<p>よみこみちゅう</p>
	</div>
	<script>
		Fancybox.bind("[data-fancybox]", {
			compact: false,
			Images: {
					Panzoom: {
						maxScale: 3,
					}}
		})
	</script>
