<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>#dotlaboratory</title>
	<!-- <link rel="icon" href="favicon.ico"> -->
	 <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/carousel/carousel.umd.js"></script>
	<script src="script.js"></script>
	<link rel="stylesheet" type="text/css" href="style.css" />
	<link rel="stylesheet" href="profile.css">
	<link rel="stylesheet" href="fonts.css">
	<link  rel="stylesheet"   href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/carousel/carousel.css">
</head>
<body onload="init()" oncontextmenu="return false;">
	<div id="container">
		<div id="logo">
			<img src="assets/images/dotlaboratory.png">
			<p>#dotlaboratory</p>
		</div>
		<div id="section1" class="section active">
			<div class="section-header">
				<div class="section-header-nav"><img src="assets/images/team-icon_3.png" onclick="changeActiveSection(`3`)"></div>
				<div class="section-header-team"><img src="assets/images/team-logo_1.png" alt=""></div>
				<div class="section-header-nav"><img src="assets/images/team-icon_2.png" onclick="changeActiveSection(`2`)"></div>
			</div>
			<div id="carousel-team1"  class="carousel f-carousel"></div>
			<div id="nav-team1" class="nav f-carousel">
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🌟</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">⚡</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🌈</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🎵</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">📓</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🎀</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🫧</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">☄️</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🔭</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🎵</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">☄️</p></div>
			</div>
		</div>
		<div id="section2" class="section">
			<div class="section-header">
				<div class="section-header-nav"><img src="assets/images/team-icon_1.png" onclick="changeActiveSection(`1`)"></div>
				<div class="section-header-team"><img src="assets/images/team-logo_2.png" alt=""></div>
				<div class="section-header-nav"><img src="assets/images/team-icon_3.png" onclick="changeActiveSection(`3`)"></div>
			</div>
			<div id="carousel-team2"  class="carousel f-carousel"></div>
			<div id="nav-team2" class="nav f-carousel">
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🌟</p></div>
			</div>
		</div>
		<div id="section3" class="section">
			<div class="section-header">
				<div class="section-header-nav"><img src="assets/images/team-icon_2.png" onclick="changeActiveSection(`2`)"></div>
				<div class="section-header-team"><img src="assets/images/team-logo_3.png" alt=""></div>
				<div class="section-header-nav"><img src="assets/images/team-icon_1.png" onclick="changeActiveSection(`1`)"></div>
			</div>
			<div id="carousel-team3"  class="carousel f-carousel"></div>
			<div id="nav-team3" class="nav f-carousel">
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">🌙</p></div>
				<div class="nav-chara f-carousel__slide"><img src="assets/images/thumbnail_1-1.png" class="thumbnail"><p class="symbol">☀</p></div>
			</div>
		</div>
	</div>
	<script>
		Fancybox.bind("[data-fancybox]", {
			compact: false,
			Images: {
					Panzoom: {
						maxScale: 3,
					}}
		})
	</script>
</body>
</html>
