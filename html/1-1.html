<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="fonts.css">
	<link rel="stylesheet" href="chara.css">
	<style>
		#bg{
			background-image: url(/images/main_1-1.png);
		}
		#footer>#cpe {
			color: #8B74B6;
			font-family: PoiretOne;
		}
		#footer>#cpe::before {
			content: '🌟';
		}
	</style>
	<title>Starlight of Imaginary</title>
</head>
<body>
	<div id="bg"></div>
	<div id="wrapper">
		<div id="header">
			<p id="cpj">不思議を彩る星のひかり</p>
			<p id="name">ペルセア</p>
			<p id="names">　</p>
		</div>
		<div id="main">
			<p>遠く遠いどこかの星で生まれ育った<br>物静かで理知的なネオンの親友。</p>
			<p>突然姿を消した婚約者を追って銀河に飛び込み<br>たどり着いた名もなきネオン街でネオンと出会った。</p>
			<p>ネオンと過ごす日常をとても大事に思っているため<br>故郷の星に帰るつもりはないが<br>婚約者に対しては未練が残っており<br>婚約の証である星光花のコサージュを手放せずにいる。</p>
			<p>空を見ながら歩くことが好き。<br>絶え間なく変わる空の景色に夢中になりがちで<br>時折転んだり電柱にぶつかったりしている。</p>
		</div>
		<div id="footer">
			<p id="cpe">Starlight of Imaginary</p>			
		</div>
	</div>
</body>
</html>
